name: Nanno
description: >-
  Nanno was an on-demand babysitting and childcare marketplace startup, founded
  in 2016 and based in Denver, Colorado, that connected parents with vetted,
  background-checked sitters through a consumer mobile app (a "childcare on
  demand" model). Backed by 500 Global among others, the company paused
  operations at the end of 2021 amid pandemic-driven labor and childcare-market
  disruption, and its technology and assets were acquired by household-management
  startup Call Emmy in May 2022. The Nanno corporate entity persists but no
  longer operates its platform; nanno.com no longer serves a live site. Nanno
  was a consumer app and never published a public developer API, SDKs, or
  developer documentation. This profile is retained as a network stub for
  historical/lineage purposes and carries no live API surface to enrich.
